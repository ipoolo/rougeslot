<!doctype html>
<!--
  R_RougeSlot · 单维聚类页（通用模板，v2）
  ====================================
  使用：clusters/random.html / combo.html / pool.html / pressure.html
  通过文件名取维度 key（pressure → structure）
  渲染：method-cluster.md 4 步聚类 +（combo / structure 维度的 v2 补充视角）
  数据：window.GAMES + window.RR_CLUSTER_DEFS（lib/cluster-definitions.js）
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>聚类 · R_RougeSlot</title>
<link rel="stylesheet" href="../lib/theme.css"/>
<style>
  .scatter-row {
    display: grid;
    grid-template-columns: 220px 1fr 60px;
    gap: 12px;
    padding: 8px 14px;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .scatter-row:hover { background: var(--bg-hover); }
  .scatter-row .name { font-size: 13px; font-weight: 600; }
  .scatter-row .name .en { color: var(--fg-dim); font-weight: 400; font-size: 11px; }
  .scatter-row .bar-bg {
    height: 16px;
    background: var(--bg-deep);
    border-radius: 8px;
    border: 1px solid var(--line);
    position: relative;
    overflow: hidden;
  }
  .scatter-row .bar-fg {
    height: 100%;
    background: linear-gradient(90deg, var(--score-low), var(--score-mid), var(--score-high));
  }
  .scatter-row .val {
    text-align: right;
    font-weight: 700;
    font-size: 14px;
    color: var(--fg);
  }
  .scatter-row.empty .name { color: var(--fg-dim); font-style: italic; }
  .scatter-row.empty .val { color: var(--fg-dim); }
</style>
</head>
<body>
<div class="wrap">

<a href="../index.html" style="font-size: 12px; color: var(--fg-muted);">← 返回总览</a>

<div id="root"></div>

<script src="../framework/v5/schema.js"></script>
<script src="../data/games.js"></script>
<script src="../lib/render.js"></script>
<script src="../lib/cluster-definitions.js"></script>
<script src="../lib/combo-synergy-clusters.js"></script>

<script>
(function () {
  'use strict';
  const RR = window.RR;
  const root = document.querySelector('#root');

  // 维度 key 从文件名取（pressure 别名 → structure）
  const fname = location.pathname.split('/').pop().replace(/\.html$/, '');
  const aliasMap = { pressure: 'structure', structure: 'structure', random: 'random', combo: 'combo', pool: 'pool' };
  const dimKey = aliasMap[fname];

  if (!dimKey || fname === '_template') {
    root.innerHTML = `
      <div class="page-head">
        <h1>聚类页（通用模板）</h1>
        <p class="lede">把此文件命名为 <span class="kbd">random.html</span> / <span class="kbd">combo.html</span> / <span class="kbd">pool.html</span> / <span class="kbd">pressure.html</span> 来按对应维度渲染。</p>
      </div>
      <div class="card" style="margin-top:24px;">
        <p>当前 URL = <code>${location.pathname}</code>，文件名 <code>${RR.escapeHtml(fname)}</code> 未匹配任一维度。</p>
      </div>
    `;
    return;
  }

  RR.renderClusterPage(dimKey, root);
  RR.checkFrameworkConsistency();
})();
</script>

</div>
</body>
</html>
