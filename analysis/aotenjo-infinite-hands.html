<!doctype html>
<!--
  R_RougeSlot · 单游戏分析详情页（通用模板）
  ==========================================
  使用：?slug=luck-be-a-landlord
  数据来源：window.GAMES + window.FRAMEWORK_SCHEMA
  特性：
    - 顶部 Steam header + 基础信息
    - 4 维评分条
    - 通用 RPB 模型图（SVG），点击标签高亮对应节点 + 显示对应字段内容
    - 7 字段定性详情
    - 压力曲线参数表
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>分析 · R_RougeSlot</title>
<link rel="stylesheet" href="../lib/theme.css"/>
<style>
  /* 详情页专属 */
  .game-hero {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
    margin-bottom: 24px;
    padding: 20px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .game-hero img {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .game-hero .meta-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .game-hero h2 { font-size: 24px; font-weight: 700; }
  .game-hero .en { font-size: 13px; color: var(--fg-muted); }
  .game-hero .dev { font-size: 12px; color: var(--fg-dim); margin-top: 2px; }
  .game-hero .summary {
    margin-top: 12px;
    padding: 10px 14px;
    background: var(--bg-deep);
    border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    color: var(--fg);
  }
  .game-hero .summary.empty { color: var(--fg-dim); font-style: italic; }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--fg-dim);
    font-size: 14px;
  }
  .empty-state code {
    background: var(--bg-deep);
    border: 1px solid var(--line);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">

<a href="../index.html" style="font-size: 12px; color: var(--fg-muted);">← 返回总览</a>

<div id="root">
  <!-- JS 注入 -->
</div>

<script src="../framework/v5/schema.js"></script>
<script src="../data/games.js"></script>
<script src="../lib/render.js"></script>

<script>
(function () {
  'use strict';
  const RR = window.RR;
  const root = document.querySelector('#root');

  // 优先 ?slug=xxx，其次从文件名（如 luck-be-a-landlord.html）回退
  let slug = RR.getSlugFromUrl();
  if (!slug) {
    const fname = location.pathname.split('/').pop().replace(/\.html$/, '');
    if (fname && fname !== '_template' && fname !== 'index') slug = fname;
  }
  if (!slug) {
    root.innerHTML = `
      <div class="empty-state">
        <p>未指定游戏 slug。</p>
        <p style="margin-top:8px;">使用方式：<code>analysis/_template.html?slug=&lt;slug&gt;</code></p>
        <p style="margin-top:8px;">或回到总览点击具体游戏卡片。</p>
      </div>
    `;
    return;
  }

  const game = RR.getGame(slug);
  if (!game) {
    root.innerHTML = `<div class="empty-state">未找到 slug = <code>${RR.escapeHtml(slug)}</code> 的游戏</div>`;
    return;
  }

  document.title = `${game.basic.name_cn || slug} · 分析 · R_RougeSlot`;

  /* ============ Hero ============ */
  const hero = document.createElement('div');
  hero.className = 'game-hero';
  const a = game.analysis;
  hero.innerHTML = `
    <img src="${RR.escapeHtml(game.basic.header_url || '')}" alt="${RR.escapeHtml(game.basic.name_cn || '')}" onerror="this.style.display='none'"/>
    <div class="meta-block">
      <h2>${RR.escapeHtml(game.basic.name_cn || slug)}</h2>
      <div class="en">${RR.escapeHtml(game.basic.name_en || '')}</div>
      <div class="dev">${RR.escapeHtml(game.basic.developer || '?')} · ${game.basic.release_year || '?'} · <a href="${RR.escapeHtml(game.basic.steam_url || '#')}" target="_blank" rel="noopener">Steam ↗</a></div>
      <div class="tags" style="margin-top:8px;">
        ${(game.basic.tags || []).map(t => `<span class="tag" style="font-size:10px; color:var(--fg-muted); background:var(--bg-deep); border:1px solid var(--line); padding:2px 6px; border-radius:10px; margin-right:4px;">${RR.escapeHtml(t)}</span>`).join('')}
      </div>
      <p class="muted" style="margin-top:8px; font-size:13px;">${RR.escapeHtml(game.basic.core_loop_oneliner || '')}</p>
      <div class="summary ${a && a.summary ? '' : 'empty'}">
        ${a && a.summary ? RR.escapeHtml(a.summary) : '尚未分析。在 session 中说："分析 ' + RR.escapeHtml(slug) + '" 让 Claude 按 v1 框架填充。'}
      </div>
    </div>
  `;
  root.appendChild(hero);

  /* ============ 评分条 ============ */
  const scoresSection = document.createElement('section');
  scoresSection.innerHTML = '<h2 class="section-title">4 维评分</h2>';
  const scoresCard = document.createElement('div');
  scoresCard.className = 'card';
  scoresCard.appendChild(RR.renderScoreBars(a ? a.scores : null));
  scoresSection.appendChild(scoresCard);
  root.appendChild(scoresSection);

  /* ============ 模型图（interactive SVG explainer 模式） ============ */
  const modelSection = document.createElement('section');
  modelSection.innerHTML = '<h2 class="section-title">RPB 统一设计模型 · 拆解视图</h2>';
  modelSection.innerHTML += `
    <div class="diag-box">
      <svg class="main" viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--fg-dim)"/>
          </marker>
        </defs>

        <!-- 区域：spin 区 / RPBD 区 -->
        <rect id="z-spin" class="zone" x="40" y="40" width="600" height="380" rx="14" fill="var(--c-random)"/>
        <rect id="z-rpbd" class="zone" x="680" y="40" width="280" height="380" rx="14" fill="var(--c-rpbd)"/>
        <text x="340" y="28" class="label-text" font-weight="700" fill="var(--c-random)" text-anchor="middle">spin 阶段（自动）</text>
        <text x="820" y="28" class="label-text" font-weight="700" fill="var(--c-rpbd)" text-anchor="middle">RPBD 阶段（玩家）</text>

        <!-- 基础池 -->
        <rect id="n-base-pool" x="80" y="80" width="180" height="60" rx="8" class="node" style="--hi: var(--c-base-pool)"/>
        <text x="170" y="116" class="nodetxt">基础池</text>

        <!-- 主动池 -->
        <rect id="n-active-pool" x="80" y="320" width="180" height="60" rx="8" class="node" style="--hi: var(--c-active-pool)"/>
        <text x="170" y="356" class="nodetxt">主动池</text>

        <!-- random 表演 -->
        <rect id="n-random" x="350" y="80" width="180" height="60" rx="8" class="node" style="--hi: var(--c-random)"/>
        <text x="440" y="108" class="nodetxt">random 表演</text>
        <text x="440" y="128" class="nodetxt" font-size="11" font-weight="400" fill="var(--fg-muted)">第一峰多巴胺</text>

        <!-- 符号协同 -->
        <rect id="n-synergy" x="350" y="180" width="180" height="56" rx="8" class="node" style="--hi: var(--c-synergy)"/>
        <text x="440" y="206" class="nodetxt">符号协同</text>
        <text x="440" y="224" class="nodetxt" font-size="11" font-weight="400" fill="var(--fg-muted)">基础池内元素互动</text>

        <!-- 规则修饰 -->
        <rect id="n-modifier" x="350" y="320" width="180" height="56" rx="8" class="node" style="--hi: var(--c-modifier)"/>
        <text x="440" y="346" class="nodetxt">规则修饰</text>
        <text x="440" y="364" class="nodetxt" font-size="11" font-weight="400" fill="var(--fg-muted)">主动池施加的修改器</text>

        <!-- combo 汇聚（虚拟节点） -->
        <circle id="n-combo" cx="610" cy="250" r="34" class="node" style="--hi: var(--c-combo)"/>
        <text x="610" y="256" class="nodetxt">combo</text>

        <!-- RPBD -->
        <rect id="n-rpbd" x="720" y="180" width="200" height="60" rx="8" class="node" style="--hi: var(--c-rpbd)"/>
        <text x="820" y="208" class="nodetxt">RPBD 构筑</text>
        <text x="820" y="226" class="nodetxt" font-size="11" font-weight="400" fill="var(--fg-muted)">玩家决策修改池</text>

        <!-- checkpoint -->
        <rect id="n-checkpoint" x="720" y="300" width="200" height="60" rx="8" class="node" style="--hi: var(--c-checkpoint)"/>
        <text x="820" y="328" class="nodetxt">checkpoint</text>
        <text x="820" y="346" class="nodetxt" font-size="11" font-weight="400" fill="var(--fg-muted)">压力机制（M/N/T₀/r）</text>

        <!-- 边 -->
        <path id="e-base-random"   d="M 260,110 L 350,110" class="edge" marker-end="url(#arr)"/>
        <path id="e-base-synergy"  d="M 260,130 L 350,200" class="edge" marker-end="url(#arr)" stroke-dasharray="4 3"/>
        <path id="e-active-mod"    d="M 260,350 L 350,350" class="edge" marker-end="url(#arr)" stroke-dasharray="4 3"/>
        <path id="e-random-combo"  d="M 530,120 Q 580,170 610,220" class="edge" marker-end="url(#arr)"/>
        <path id="e-synergy-combo" d="M 530,210 Q 570,225 580,240" class="edge" marker-end="url(#arr)"/>
        <path id="e-mod-combo"     d="M 530,340 Q 580,300 610,280" class="edge" marker-end="url(#arr)"/>
        <path id="e-combo-rpbd"    d="M 644,250 Q 690,225 720,210" class="edge" marker-end="url(#arr)"/>
        <path id="e-combo-cp"      d="M 644,250 Q 690,280 720,320" class="edge" marker-end="url(#arr)"/>
        <path id="e-rpbd-back-base" d="M 720,200 Q 480,40 170,80" class="edge" marker-end="url(#arr)" stroke-dasharray="4 3" opacity="0.6"/>
        <path id="e-rpbd-back-active" d="M 720,230 Q 480,440 170,340" class="edge" marker-end="url(#arr)" stroke-dasharray="4 3" opacity="0.6"/>

      </svg>
    </div>
    <div class="tags-bar" id="tags-bar">
      <button class="tag-btn active" data-view="all">全部</button>
      <button class="tag-btn" data-view="random">① random 表演</button>
      <button class="tag-btn" data-view="synergy">② 符号协同</button>
      <button class="tag-btn" data-view="modifier">③ 规则修饰</button>
      <button class="tag-btn" data-view="pool">④ 双层池</button>
      <button class="tag-btn" data-view="rpbd">⑤ RPBD</button>
      <button class="tag-btn" data-view="checkpoint">⑥ 压力</button>
    </div>
    <div class="minfo" id="model-info">点击上方任一标签查看对应机制在本游戏中的具体设计。</div>
  `;
  root.appendChild(modelSection);

  /* views 配置：标签 → 高亮 + 字段内容 */
  const q = (a && a.qualitative) || {};
  const views = {
    all: {
      nodes: ['n-base-pool', 'n-active-pool', 'n-random', 'n-synergy', 'n-modifier', 'n-combo', 'n-rpbd', 'n-checkpoint'],
      edges: ['e-base-random', 'e-base-synergy', 'e-active-mod', 'e-random-combo', 'e-synergy-combo', 'e-mod-combo', 'e-combo-rpbd', 'e-combo-cp', 'e-rpbd-back-base', 'e-rpbd-back-active'],
      zones: ['z-spin', 'z-rpbd'],
      info: '<b>整体流动</b> · 基础池→（random + 协同），主动池→修饰，三股汇成 combo，combo 推动 checkpoint 与 RPBD，RPBD 反过来改两个池。'
    },
    random: {
      nodes: ['n-base-pool', 'n-random'],
      edges: ['e-base-random'],
      zones: ['z-spin'],
      info: `<b>① random 表演</b> · ${q.random_design ? RR.escapeHtml(q.random_design) : '<i>未填</i>'}`
    },
    synergy: {
      nodes: ['n-base-pool', 'n-synergy', 'n-combo'],
      edges: ['e-base-synergy', 'e-synergy-combo'],
      zones: ['z-spin'],
      info: `<b>② 符号协同</b> · ${q.combo_synergy ? RR.escapeHtml(q.combo_synergy) : '<i>未填</i>'}`
    },
    modifier: {
      nodes: ['n-active-pool', 'n-modifier', 'n-combo'],
      edges: ['e-active-mod', 'e-mod-combo'],
      zones: ['z-spin'],
      info: `<b>③ 规则修饰</b> · ${q.combo_modifier ? RR.escapeHtml(q.combo_modifier) : '<i>未填</i>'}`
    },
    pool: {
      nodes: ['n-base-pool', 'n-active-pool'],
      edges: [],
      zones: [],
      info: `<b>④ 双层池</b><br>· <b>基础池</b>：${q.pool_base_desc ? RR.escapeHtml(q.pool_base_desc) : '<i>未填</i>'}<br>· <b>主动池</b>：${q.pool_active_desc ? RR.escapeHtml(q.pool_active_desc) : '<i>未填</i>'}`
    },
    rpbd: {
      nodes: ['n-rpbd', 'n-combo'],
      edges: ['e-combo-rpbd', 'e-rpbd-back-base', 'e-rpbd-back-active'],
      zones: ['z-rpbd'],
      info: `<b>⑤ RPBD 构筑</b> · ${q.rpbd_construction ? RR.escapeHtml(q.rpbd_construction) : '<i>未填</i>'}`
    },
    checkpoint: {
      nodes: ['n-checkpoint', 'n-combo'],
      edges: ['e-combo-cp'],
      zones: ['z-rpbd'],
      info: `<b>⑥ 压力机制</b> · ${q.checkpoint_mechanism ? RR.escapeHtml(q.checkpoint_mechanism) : '<i>未填</i>'}`
    }
  };
  const svg = document.querySelector('svg.main');
  const minfo = document.querySelector('#model-info');
  const tagBtns = document.querySelectorAll('#tags-bar .tag-btn');
  function applyView(key) {
    svg.querySelectorAll('.node').forEach(el => el.classList.remove('active'));
    svg.querySelectorAll('.edge').forEach(el => el.classList.remove('hi'));
    svg.querySelectorAll('.zone').forEach(el => el.classList.remove('hi'));
    const v = views[key];
    if (!v) return;
    v.nodes.forEach(id => document.getElementById(id)?.classList.add('active'));
    v.edges.forEach(id => document.getElementById(id)?.classList.add('hi'));
    v.zones.forEach(id => document.getElementById(id)?.classList.add('hi'));
    minfo.innerHTML = v.info;
  }
  tagBtns.forEach(b => {
    b.addEventListener('click', () => {
      tagBtns.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      applyView(b.dataset.view);
    });
  });
  applyView('all');

  /* ============ 详细字段（两列） ============ */
  const detailSection = document.createElement('section');
  detailSection.innerHTML = '<h2 class="section-title">7 字段定性拆解</h2>';
  const twoCol = document.createElement('div');
  twoCol.className = 'two-col';
  // 左列：池 + 设计
  const leftCol = document.createElement('div');
  // 右列：构筑 + 压力
  const rightCol = document.createElement('div');
  twoCol.appendChild(leftCol);
  twoCol.appendChild(rightCol);
  // 简化：直接全堆在一起，依靠 grid 自动排
  const blocks = RR.renderQualitativeBlocks(a ? a.qualitative : null);
  Array.from(blocks.children).forEach((b, i) => {
    (i % 2 === 0 ? leftCol : rightCol).appendChild(b);
  });
  detailSection.appendChild(twoCol);
  root.appendChild(detailSection);

  /* ============ 压力曲线参数 + 分析（v2 加强） ============ */
  const pressureSection = document.createElement('section');
  pressureSection.innerHTML = '<h2 class="section-title">压力曲线参数 + 分析</h2>';
  const pcard = document.createElement('div');
  pcard.className = 'card';
  pcard.appendChild(RR.renderPressureParams(a ? a.pressure_params : null));
  pressureSection.appendChild(pcard);

  // 派生分析：曲线类型识别 + 序列推算 + 横向对比
  pressureSection.appendChild(RR.renderPressureAnalysis(game, RR.getAllGames()));

  root.appendChild(pressureSection);

  /* ============ 元数据 ============ */
  const meta = document.createElement('p');
  meta.className = 'dim';
  meta.style.cssText = 'font-size: 12px; margin-top: 24px; text-align: right;';
  meta.innerHTML = a
    ? `分析框架版本 <span class="kbd">${a.framework_version}</span> · 更新于 ${a.updated_at}`
    : `<span style="color:var(--warn)">尚未分析</span> · 在 session 中执行 "分析 ${slug}"`;
  root.appendChild(meta);

  /* ============ 一致性检查 ============ */
  RR.checkFrameworkConsistency();
})();
</script>

</div>
</body>
</html>
