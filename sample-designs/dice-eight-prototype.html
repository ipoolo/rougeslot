<!doctype html>
<!--
  R_RougeSlot · 骰子德州 · 交互原型 v0.2
  =======================================
  v0.2 升级：
  - 4 乘性维度计分（符号价值 × 符号倍率 × 图形分 × 图形倍率）
  - 左侧符号概率表 + 右侧图形分数表（Cloverpit 同构 UI）
  - 逐牌型顺序触发 + 贡献骰子高亮 + 速度递增 + Web Audio 合成音效
-->
<html lang="zh-CN">
<head>

<link rel="stylesheet" href="../lib/theme.css"/>
<style>

<script>
'use strict';

// ============================================================
// 数据层
// ============================================================

// 符号价值表（决策 1A · 按点数 6 档）
const SYMBOL_VALUES = { 1: 2, 2: 2, 3: 3, 4: 3, 5: 5, 6: 7 };
// 符号倍率表（默认全 1，charm 可改）
let symbolMults = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1 };
// 颜色概率偏置（默认均等 1/3，charm 可改）
let colorWeights = { R: 1, G: 1, B: 1 };
// 点数概率偏置（默认均等 1/6，charm 可改）
let pointWeights = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1 };

// 牌型表（决策 2 · 用户采纳的建议值，按 figure_score 升序排）
const PATTERNS = [
  // Tier 1（×1.0）
  { key: 'pair', name: '一对', figure_score: 1.0, tier: 1, find: findPair },
  { key: 'two_pair', name: '两对', figure_score: 1.0, tier: 1, find: findTwoPair },
  { key: 'rainbow', name: '彩虹(3色)', figure_score: 1.0, tier: 1, find: findRainbow },
  { key: 'color_pair', name: '同色对', figure_score: 1.0, tier: 1, find: findColorPair },
  { key: 'three', name: '三条', figure_score: 1.0, tier: 1, find: (d) => findNOfKind(d, 3) },
  // Tier 2（×1.5）
  { key: 'full_house', name: '葫芦', figure_score: 1.5, tier: 2, find: findFullHouse },
  { key: 'three_pair', name: '三对', figure_score: 1.5, tier: 2, find: findThreePair },
  // Tier 3（×2-3）
  { key: 'straight', name: '顺子', figure_score: 2.0, tier: 2, find: (d) => findStraight(d, 5) },
  { key: 'color_group_5', name: '同色组5', figure_score: 2.0, tier: 2, find: (d) => findColorGroup(d, 5) },
  { key: 'four', name: '四条', figure_score: 2.5, tier: 2, find: (d) => findNOfKind(d, 4) },
  { key: 'color_three', name: '同色三条', figure_score: 2.5, tier: 2, find: (d) => findColorNOfKind(d, 3) },
  { key: 'big_straight', name: '大顺(1-6)', figure_score: 3.0, tier: 3, find: (d) => findStraight(d, 6) },
  { key: 'double_full_house', name: '双葫芦', figure_score: 3.0, tier: 3, find: findDoubleFullHouse },
  // Tier 4（×4-5）
  { key: 'color_group_6', name: '同色组6', figure_score: 4.0, tier: 3, find: (d) => findColorGroup(d, 6) },
  { key: 'five', name: '五条', figure_score: 5.0, tier: 3, find: (d) => findNOfKind(d, 5) },
  // Tier 5（×7-8）
  { key: 'color_straight', name: '同色顺子', figure_score: 7.0, tier: 4, find: findColorStraight },
  { key: 'color_four', name: '同色四条', figure_score: 7.0, tier: 4, find: (d) => findColorNOfKind(d, 4) },
  { key: 'color_group_7', name: '同色组7', figure_score: 8.0, tier: 4, find: (d) => findColorGroup(d, 7) },
  // Tier 6（×10-15）
  { key: 'six', name: '六条', figure_score: 12.0, tier: 4, find: (d) => findNOfKind(d, 6) },
  { key: 'color_big_straight', name: '同色大顺', figure_score: 15.0, tier: 4, find: findColorBigStraight },
  // 传奇（×25+）
  { key: 'all_same_color', name: '全同色8', figure_score: 25.0, tier: 5, find: findAllSameColor },
  { key: 'color_five', name: '同色五条', figure_score: 25.0, tier: 5, find: (d) => findColorNOfKind(d, 5) },
  { key: 'seven', name: '七条', figure_score: 30.0, tier: 5, find: (d) => findNOfKind(d, 7) },
  { key: 'eight', name: '八条', figure_score: 50.0, tier: 5, find: (d) => findNOfKind(d, 8) }
];

// 全局倍率
let globalSymMult = 1.0;
let globalFigMult = 1.0;

// 颜色 / 点数 / 骰面字符
const COLORS = ['R', 'G', 'B'];
const POINTS = [1,2,3,4,5,6];
const DIE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];

// ============================================================
// 牌型查找函数（返回贡献骰子的索引列表 + 当前最佳贡献分）
// ============================================================
// 返回 { dice_idx: [...], desc: '...' } 或 null

function findNOfKind(dice, n) {
  // 取最高点数 + 最多颗数的组合（前 n 个）
  const byPoint = {};
  dice.forEach((d, i) => {
    if (d.wild) return; // wild 单独处理
    if (!byPoint[d.p]) byPoint[d.p] = [];
    byPoint[d.p].push(i);
  });
  // 加 wild 到最大点
  const wilds = dice.map((d, i) => d.wild ? i : -1).filter(i => i >= 0);

  // 找最大点
  let best = null;
  for (const p of POINTS) {
    const lst = byPoint[p] || [];
    const total = lst.length + wilds.length;
    if (total >= n) {
      const dice_idx = lst.slice(0, n - Math.min(wilds.length, n - lst.length));
      const wildUsed = wilds.slice(0, n - dice_idx.length);
      const idx = [...dice_idx, ...wildUsed].slice(0, n);
      if (!best || p > best.point) best = { dice_idx: idx, point: p };
    }
  }
  return best ? { dice_idx: best.dice_idx } : null;
}

function findPair(dice) { return findNOfKind(dice, 2); }

function findTwoPair(dice) {
  const byPoint = {};
  dice.forEach((d, i) => { if (!d.wild) { if (!byPoint[d.p]) byPoint[d.p]=[]; byPoint[d.p].push(i); }});
  const pairs = Object.entries(byPoint).filter(([_, v]) => v.length >= 2).sort((a,b) => +b[0] - +a[0]);
  if (pairs.length >= 2) return { dice_idx: [pairs[0][1][0], pairs[0][1][1], pairs[1][1][0], pairs[1][1][1]] };
  return null;
}

function findThreePair(dice) {
  const byPoint = {};
  dice.forEach((d, i) => { if (!d.wild) { if (!byPoint[d.p]) byPoint[d.p]=[]; byPoint[d.p].push(i); }});
  const pairs = Object.entries(byPoint).filter(([_, v]) => v.length >= 2).sort((a,b) => +b[0] - +a[0]);
  if (pairs.length >= 3) return { dice_idx: pairs.slice(0,3).flatMap(([_,v]) => v.slice(0,2)) };
  return null;
}

function findFullHouse(dice) {
  const byPoint = {};
  dice.forEach((d, i) => { if (!d.wild) { if (!byPoint[d.p]) byPoint[d.p]=[]; byPoint[d.p].push(i); }});
  const entries = Object.entries(byPoint).sort((a,b) => b[1].length - a[1].length || +b[0] - +a[0]);
  // 找一个 ≥3 和一个 ≥2（不同点）
  let triple = null, pair = null;
  for (const [p, lst] of entries) {
    if (!triple && lst.length >= 3) { triple = { p, idx: lst.slice(0,3) }; continue; }
    if (triple && !pair && lst.length >= 2 && p !== triple.p) { pair = { p, idx: lst.slice(0,2) }; break; }
  }
  if (triple && pair) return { dice_idx: [...triple.idx, ...pair.idx] };
  return null;
}

function findDoubleFullHouse(dice) {
  const byPoint = {};
  dice.forEach((d, i) => { if (!d.wild) { if (!byPoint[d.p]) byPoint[d.p]=[]; byPoint[d.p].push(i); }});
  const triples = Object.entries(byPoint).filter(([_, v]) => v.length >= 3);
  if (triples.length >= 2) return { dice_idx: [...triples[0][1].slice(0,3), ...triples[1][1].slice(0,3)] };
  return null;
}

function findStraight(dice, len) {
  const pointsToIdx = {};
  dice.forEach((d, i) => { if (!d.wild && !pointsToIdx[d.p]) pointsToIdx[d.p] = i; });
  const sortedPts = Object.keys(pointsToIdx).map(Number).sort((a,b) => a-b);
  // 找最长连续段
  for (let start = 0; start <= sortedPts.length - len; start++) {
    let cont = 1, last = sortedPts[start];
    for (let j = start+1; j < sortedPts.length; j++) {
      if (sortedPts[j] === last+1) { cont++; last = sortedPts[j]; if (cont >= len) {
        const segPts = sortedPts.slice(start, start+cont);
        return { dice_idx: segPts.map(p => pointsToIdx[p]) };
      }} else break;
    }
  }
  return null;
}

function findColorPair(dice) {
  const byPC = {};
  dice.forEach((d, i) => { if (!d.wild) { const k = d.p+d.c; if (!byPC[k]) byPC[k]=[]; byPC[k].push(i); }});
  const found = Object.values(byPC).find(v => v.length >= 2);
  return found ? { dice_idx: found.slice(0,2) } : null;
}

function findColorNOfKind(dice, n) {
  const byPC = {};
  dice.forEach((d, i) => { if (!d.wild) { const k = d.p+d.c; if (!byPC[k]) byPC[k]=[]; byPC[k].push(i); }});
  const found = Object.values(byPC).filter(v => v.length >= n).sort((a,b) => b.length - a.length);
  return found.length > 0 ? { dice_idx: found[0].slice(0,n) } : null;
}

function findColorGroup(dice, n) {
  const byColor = {};
  dice.forEach((d, i) => { if (!d.wild) { if (!byColor[d.c]) byColor[d.c]=[]; byColor[d.c].push(i); }});
  const found = Object.values(byColor).filter(v => v.length >= n).sort((a,b) => b.length - a.length);
  return found.length > 0 ? { dice_idx: found[0].slice(0,n) } : null;
}

function findAllSameColor(dice) {
  const byColor = {};
  dice.forEach((d, i) => { if (!d.wild) { if (!byColor[d.c]) byColor[d.c]=[]; byColor[d.c].push(i); }});
  const found = Object.entries(byColor).find(([_, v]) => v.length === dice.filter(d=>!d.wild).length);
  return found ? { dice_idx: found[1] } : null;
}

function findColorStraight(dice) {
  for (const c of COLORS) {
    const subDice = dice.map((d, i) => ({ ...d, _origIdx: i })).filter(d => d.c === c && !d.wild);
    if (subDice.length < 5) continue;
    const result = findStraight(subDice, 5);
    if (result) return { dice_idx: result.dice_idx.map(i => subDice[i]._origIdx) };
  }
  return null;
}

function findColorBigStraight(dice) {
  for (const c of COLORS) {
    const subDice = dice.map((d, i) => ({ ...d, _origIdx: i })).filter(d => d.c === c && !d.wild);
    if (subDice.length < 6) continue;
    const result = findStraight(subDice, 6);
    if (result) return { dice_idx: result.dice_idx.map(i => subDice[i]._origIdx) };
  }
  return null;
}

function findRainbow(dice) {
  const colorSet = new Set(dice.filter(d => !d.wild).map(d => d.c));
  if (colorSet.size >= 3) {
    // 取每色第一个骰
    const seen = new Set();
    const idx = [];
    dice.forEach((d, i) => { if (!d.wild && !seen.has(d.c)) { seen.add(d.c); idx.push(i); }});
    return { dice_idx: idx.slice(0, 3) };
  }
  return null;
}

// ============================================================
// 加权随机
// ============================================================
function weightedPick(weights) {
  const entries = Object.entries(weights);
  const total = entries.reduce((s, [_, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [k, w] of entries) {
    r -= w;
    if (r <= 0) return k;
  }
  return entries[0][0];
}

function rollDice() {
  // 重置 charm 一次性效果
  resetCharmsForRoll();
  for (const c of STATE.charms) if (c.apply) c.apply();

  let dice = [];
  for (let i = 0; i < STATE.diceCount; i++) {
    dice.push({
      p: parseInt(weightedPick(pointWeights)),
      c: weightedPick(colorWeights)
    });
  }
  // wild
  for (const c of STATE.charms) {
    if (c.applyWild) {
      const idx = Math.floor(Math.random() * dice.length);
      dice[idx].wild = true;
    }
  }
  return dice;
}

function resetCharmsForRoll() {
  symbolMults = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1 };
  colorWeights = { R: 1, G: 1, B: 1 };
  pointWeights = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1 };
  globalSymMult = 1.0;
  globalFigMult = 1.0;
}

// ============================================================
// 计分：4 乘性维度
// ============================================================
function calcPatternScore(pattern, dice, contributingIdx) {
  // 符号分基底：Σ(value × symMult)
  let baseSum = 0;
  let symMultProduct = 1;
  for (const i of contributingIdx) {
    const d = dice[i];
    const point = d.wild ? 6 : d.p;  // wild 算作 6 点
    const val = SYMBOL_VALUES[point] || 0;
    baseSum += val;
    symMultProduct *= symbolMults[point] || 1;
  }
  // 图形分 + 图形倍率
  let figMult = 1;
  for (const c of STATE.charms) {
    if (c.mult && c.mult[pattern.key]) figMult *= c.mult[pattern.key];
  }
  const final = baseSum * symMultProduct * pattern.figure_score * figMult * globalFigMult;
  return {
    base: baseSum,
    symMult: symMultProduct,
    figScore: pattern.figure_score,
    figMult: figMult * globalFigMult,
    final: Math.round(final)
  };
}

// ============================================================
// Web Audio API 音效
// ============================================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playBlip(tier) {
  if (!document.getElementById('sfx-toggle').checked) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    const freqMap = [220, 330, 440, 660, 880, 1320];  // Tier 1-5
    const freq = freqMap[Math.min(tier, freqMap.length-1)];
    osc.type = tier >= 4 ? 'square' : 'sine';
    osc.frequency.value = freq;

    const dur = 0.08 + tier * 0.04;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);

    // 高阶 tier 加和弦
    if (tier >= 4) {
      const osc2 = ctx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.value = freq * 1.5;
      const gain2 = ctx.createGain();
      gain2.gain.setValueAtTime(0.001, ctx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.1, ctx.currentTime + 0.02);
      gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc2.connect(gain2); gain2.connect(ctx.destination);
      osc2.start(); osc2.stop(ctx.currentTime + dur);
    }
  } catch (e) { /* ignore */ }
}

function playRollSound() {
  if (!document.getElementById('sfx-toggle').checked) return;
  try {
    const ctx = getAudioCtx();
    // 白噪声短促一击
    for (let k = 0; k < 5; k++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 80 + Math.random() * 120;
      const t = ctx.currentTime + k * 0.04;
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.05, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.06);
    }
  } catch (e) {}
}

function playFinalGong() {
  if (!document.getElementById('sfx-toggle').checked) return;
  try {
    const ctx = getAudioCtx();
    // 锣鼓声
    const freqs = [180, 270, 360];
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle'; osc.frequency.value = f;
      const t = ctx.currentTime + i * 0.05;
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.4);
    });
  } catch (e) {}
}

// ============================================================

// ============================================================
function renderSymbolTable() {
  const totalW = Object.values(pointWeights).reduce((s,v)=>s+v, 0);
  const html = POINTS.map(p => {
    const prob = ((pointWeights[p] / totalW) * 100).toFixed(1);
    const boosted = pointWeights[p] > 1.01;
    const sMult = symbolMults[p];
    return `
      <div class="symbol-row ${boosted ? 'boosted' : ''}">
        <div class="icon">${DIE_FACES[p-1]}</div>
        <div class="val"><span class="yen">φ:</span> ${SYMBOL_VALUES[p]}${sMult > 1.01 ? ' <span style="color:#fbbf24;">×' + sMult.toFixed(1) + '</span>' : ''}</div>
        <div class="prob">${prob}%</div>
      </div>
    `;
  }).join('');
  document.getElementById('symbol-table').innerHTML = html;
  document.getElementById('sym-mult-display').textContent = 'φ × ' + globalSymMult.toFixed(1);
}

function renderPatternTable() {
  const tierClass = { 1: 'tier-1', 2: 'tier-2', 3: 'tier-3', 4: 'tier-4', 5: 'tier-legendary' };
  const html = PATTERNS.map(p => {
    // 计算当前 figure_score × figMult（charm 加成）
    let figMult = 1;
    for (const c of STATE.charms) {
      if (c.mult && c.mult[p.key]) figMult *= c.mult[p.key];
    }
    const totalScore = p.figure_score * figMult * globalFigMult;
    const cls = tierClass[p.tier] || 'tier-1';
    return `
      <div class="pattern-row ${cls}" data-pattern-key="${p.key}">
        <div>${p.name}</div>
        <div class="score-val">φ ×${totalScore.toFixed(1)}</div>
      </div>
    `;
  }).join('');
  document.getElementById('pattern-table').innerHTML = html;
  document.getElementById('fig-mult-display').textContent = 'φ × ' + globalFigMult.toFixed(1);
}

function renderDice(dice) {
  const row = document.getElementById('dice-row');
  row.innerHTML = '';
  dice.forEach((d, i) => {
    const die = document.createElement('div');
    die.className = 'die die-' + d.c;
    die.dataset.idx = i;
    die.innerHTML = `${d.wild ? '★' : DIE_FACES[d.p - 1]}<span class="value-tag">${SYMBOL_VALUES[d.wild ? 6 : d.p]}</span>`;
    die.title = `${d.p} 点 / ${d.c === 'R' ? '红' : d.c === 'G' ? '绿' : '蓝'} / 价值 ${SYMBOL_VALUES[d.wild ? 6 : d.p]}${d.wild ? ' / wild' : ''}`;
    row.appendChild(die);
  });
}

function renderCharms() {
  const strip = document.getElementById('charm-strip');
  let html = '';
  for (let i = 0; i < 5; i++) {
    const c = STATE.charms[i];
    if (c) {
      html += `<div class="charm-slot filled"><div class="pos">${i+1}</div><div class="name" title="${c.effect}">${c.name}</div></div>`;
    } else {
      html += `<div class="charm-slot"><div class="pos">${i+1}</div><div style="color: var(--fg-muted);">空</div></div>`;
    }
  }
  strip.innerHTML = html;
}

function renderDebt() {
  const target = Math.round(STATE.T0 * Math.pow(STATE.r, STATE.week - 1));
  document.getElementById('debt-target').textContent = target.toLocaleString();
  document.getElementById('cur-score').textContent = STATE.scoreThisWeek.toLocaleString();
  document.getElementById('spins-left').textContent = STATE.spinsThisWeek;
  document.getElementById('btn-end-week').disabled = !(STATE.spinsThisWeek === 0 || STATE.scoreThisWeek >= target);

  const wp = document.getElementById('week-progress');
  wp.innerHTML = '';
  for (let i = 1; i <= STATE.M; i++) {
    const pill = document.createElement('div');
    pill.className = 'week-pill';
    if (STATE.cleared.includes(i)) pill.classList.add('cleared');
    else if (i === STATE.week) pill.classList.add('current');
    pill.textContent = 'W' + i;
    wp.appendChild(pill);
  }
}

// ============================================================
// 异步顺序触发牌型 + 视觉/音效
// ============================================================
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function executeMatches(dice, matchedPatterns) {
  const scoreboard = document.getElementById('scoreboard');
  scoreboard.innerHTML = '';

  let cumulative = 0;
  let delay = 800;

  for (let i = 0; i < matchedPatterns.length; i++) {
    const { pattern, contrib } = matchedPatterns[i];

    // 1. 高亮贡献骰子
    document.querySelectorAll('.die').forEach(el => el.classList.remove('contributing'));
    for (const idx of contrib.dice_idx) {
      const el = document.querySelector(`.die[data-idx="${idx}"]`);
      if (el) el.classList.add('contributing');
    }

    // 2. 高亮图形表对应行
    document.querySelectorAll('.pattern-row.matched-now').forEach(el => el.classList.remove('matched-now'));
    const patRow = document.querySelector(`.pattern-row[data-pattern-key="${pattern.key}"]`);
    if (patRow) patRow.classList.add('matched-now');

    // 3. 计分
    const result = calcPatternScore(pattern, dice, contrib.dice_idx);
    cumulative += result.final;

    // 4. 音效
    playBlip(pattern.tier);

    // 5. 显示
    const isLegend = pattern.tier >= 5;
    const formula = `<span class="pattern">${pattern.name}</span> ${result.base}×${result.symMult.toFixed(1)}×${result.figScore.toFixed(1)}×${result.figMult.toFixed(1)}`;
    const row = document.createElement('div');
    row.className = 'score-row' + (isLegend ? ' legendary' : '');
    row.innerHTML = `<div class="formula">${formula}</div><div class="points">+${result.final.toLocaleString()}</div>`;
    scoreboard.appendChild(row);
    scoreboard.scrollTop = scoreboard.scrollHeight;

    await sleep(delay);
    // 速度递增（800ms → 150ms）
    delay = Math.max(150, delay - 80);
  }

  // 清除高亮
  document.querySelectorAll('.die').forEach(el => el.classList.remove('contributing'));
  document.querySelectorAll('.pattern-row.matched-now').forEach(el => el.classList.remove('matched-now'));

  // 总计
  const totalRow = document.createElement('div');
  totalRow.className = 'score-row total';
  totalRow.innerHTML = `<div class="formula"><span class="pattern">本次总计</span></div><div class="points">${cumulative.toLocaleString()}</div>`;
  scoreboard.appendChild(totalRow);

  if (cumulative > 0) playFinalGong();

  STATE.scoreThisWeek += cumulative;
  STATE.spinsThisWeek--;
  renderDebt();
}

async function doRoll() {
  if (STATE.spinsThisWeek <= 0 || STATE.isRolling) return;
  STATE.isRolling = true;
  document.getElementById('btn-roll').disabled = true;

  playRollSound();
  const dice = rollDice();
  renderDice(dice);
  renderSymbolTable();   // charm 可能改变概率
  renderPatternTable();  // charm 可能改变图形倍率

  await sleep(700);  // 等掷骰动画

  // 找所有匹配的牌型 + 贡献骰子
  const matched = [];
  for (const p of PATTERNS) {
    const contrib = p.find(dice);
    if (contrib) matched.push({ pattern: p, contrib });
  }

  if (matched.length === 0) {
    document.getElementById('scoreboard').innerHTML = '<div style="text-align:center; color: var(--fg-muted); padding: 12px;">本次无成型牌型</div>';
    STATE.spinsThisWeek--;
    renderDebt();
  } else {
    await executeMatches(dice, matched);
  }

  STATE.isRolling = false;
  document.getElementById('btn-roll').disabled = false;
}

// ============================================================
// 周流程
// ============================================================
function endWeek() {
  const target = Math.round(STATE.T0 * Math.pow(STATE.r, STATE.week - 1));
  if (STATE.scoreThisWeek >= target) {
    STATE.cleared.push(STATE.week);
    STATE.totalScore += STATE.scoreThisWeek;
    if (STATE.week >= STATE.M) {
      alert(`🎉 通关！6 周债务全部还清，总分 ${STATE.totalScore.toLocaleString()}`);
      return;
    }
    openShop();
  } else {
    alert(`☠ 本周未达标（${STATE.scoreThisWeek} / ${target}）· 游戏结束`);
    resetGame();
  }
}

function openShop() {
  document.getElementById('shop-week').textContent = STATE.week;
  const pool = CHARM_POOL.filter(c => !STATE.charms.find(x => x.name === c.name));
  const offers = [];
  for (let i = 0; i < 3 && pool.length > 0; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    offers.push(pool.splice(idx, 1)[0]);
  }
  const options = document.getElementById('shop-options');
  const RARITY_COLOR = { common: '#94a3b8', rare: '#60a5fa', epic: '#a78bfa', legendary: '#fbbf24' };
  options.innerHTML = offers.map((c, i) => `
    <div class="shop-card" data-idx="${i}">
      <div class="charm-name">${c.name} <span class="charm-rarity" style="background: ${RARITY_COLOR[c.rarity]}; color: white;">${c.rarity}</span></div>
      <div class="charm-effect">${c.effect}</div>
    </div>
  `).join('');
  options.querySelectorAll('.shop-card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.idx);
      if (STATE.charms.length < 5) {
        STATE.charms.push(offers[idx]);
        nextWeek();
      } else {
        alert('已满 5 装备槽');
      }
    });
  });
  document.getElementById('shop-modal').classList.add('show');
}

function nextWeek() {
  document.getElementById('shop-modal').classList.remove('show');
  STATE.week++;
  STATE.spinsThisWeek = 3;
  STATE.scoreThisWeek = 0;
  renderDebt();
  renderCharms();
  renderSymbolTable();
  renderPatternTable();
  document.getElementById('scoreboard').innerHTML = '<div style="text-align: center; color: var(--fg-muted); padding: 12px;">新一周开始 · 点击 [掷骰] 开局</div>';
  document.getElementById('dice-row').innerHTML = '<div style="color: var(--fg-muted); font-size: 13px; padding: 20px;">点击下方 [掷骰] 开始</div>';
}

function resetGame() {
  STATE.week = 1; STATE.spinsThisWeek = 3; STATE.scoreThisWeek = 0;
  STATE.totalScore = 0; STATE.cleared = []; STATE.charms = [];
  resetCharmsForRoll();
  renderDebt(); renderCharms(); renderSymbolTable(); renderPatternTable();
  document.getElementById('scoreboard').innerHTML = '<div style="text-align: center; color: var(--fg-muted); padding: 12px;">尚无结果</div>';
  document.getElementById('dice-row').innerHTML = '<div style="color: var(--fg-muted); font-size: 13px; padding: 20px;">点击下方 [掷骰] 开始</div>';
}

// ============================================================
// 事件 + 初始化
// ============================================================
document.getElementById('btn-roll').addEventListener('click', doRoll);
document.getElementById('btn-end-week').addEventListener('click', endWeek);
document.getElementById('btn-reset').addEventListener('click', resetGame);
document.getElementById('btn-skip-shop').addEventListener('click', () => {
  document.getElementById('shop-modal').classList.remove('show');
  nextWeek();
});

renderDebt();
renderCharms();
renderSymbolTable();
renderPatternTable();
</script>

</body>
</html>
